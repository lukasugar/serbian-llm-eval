# Sample configuration file for serbian-llm-eval
# This file defines multiple evaluation runs to be executed sequentially

runs:
  # Run the stuff that needs a single run
  - model: "hf-causal-experimental"
    # model_args: ["pretrained=Qwen/Qwen2.5-0.5B", "pretrained=Qwen/Qwen2.5-0.5B-Instruct"]
    model_args: ["pretrained=Qwen/Qwen2.5-0.5B-Instruct"]
    language: ["Serbian-Cyrillic", "Serbian", "English"]  # Multiple languages
    tasks: ["openbookqa", "boolq", "arc_challenge", "arc_easy", "hellaswag", "piqa", "winogrande"]
    # device: "cuda:0"
    device: "mps"  # Change to "cuda:0" for GPU or "cpu" for CPU
    num_fewshot: 0
    batch_size: 4
    output_base_path: "./results/new/"  # Will be auto-adjusted based on model_args, language, and tasks
    write_out: true
    limit: 10

  # Run the stuff that needs multiple shots
  - model: "hf-causal-experimental"
    # model_args: ["pretrained=Qwen/Qwen2.5-0.5B", "pretrained=Qwen/Qwen2.5-0.5B-Instruct"]
    model_args: [ "pretrained=Qwen/Qwen2.5-0.5B-Instruct"]
    language: ["Serbian-Cyrillic", "Serbian", "English"]  # Multiple languages
    tasks: ["nq_open", "triviaqa"]
    num_fewshot: 5
    batch_size: 4
    # device: "cuda:0"
    device: "mps"  # Change to "cuda:0" for GPU or "cpu" for CPU
    output_base_path: "./results/new/"  # Will be auto-adjusted based on model_args, language, and tasks
    write_out: true
    limit: 10
